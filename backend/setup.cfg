[flake8]
exclude = */__init__.py
ignore = E203,W503
max-line-length = 99
show-source = true

# [coverage:run]
# source =
#     src
# omit =
#     test/*

[coverage:report]
# Minimum coverage for the project to pass
fail_under = 55
show_missing = True
omit =
    src/manage.py
    src/server.py
    src/models/abc.py
    test/*
exclude_lines =
    if __name__ == .__main__.:
